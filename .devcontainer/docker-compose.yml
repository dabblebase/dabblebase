version: '3'
services:
  httpd:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - tinkerbase-monorepo-node_modules:/workspace/node_modules
      - tinkerbase-web-node_modules:/workspace/web/node_modules
    command: /bin/sh -c "while sleep 1000; do :; done"
    environment:
      - windir # Defined on Windows but not on other platforms
  db-admin:
    image: postgres:15.2
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tinkerbase_admin
    volumes:
      - tinkerbase-admin-db:/var/lib/postgresql/data
  db-content:
    image: postgres:15.2
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tinkerbase_content
    volumes:
      - tinkerbase-content-db:/var/lib/postgresql/data

volumes:
  tinkerbase-monorepo-node_modules:
  tinkerbase-web-node_modules:
  tinkerbase-admin-db:
  tinkerbase-content-db: