version: '3'
services:
  httpd:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - dabblebase-monorepo-node_modules:/workspace/node_modules
      - dabblebase-web-node_modules:/workspace/web/node_modules
    command: /bin/sh -c "while sleep 1000; do :; done"
    environment:
      - windir # Defined on Windows but not on other platforms
  db-admin-cluster:
    image: postgres:15.2
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dabblebase_admin
    volumes:
      - dabblebase-admin-db:/var/lib/postgresql/data
  db-content-cluster:
    image: postgres:15.2
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - dabblebase-content-db:/var/lib/postgresql/data
  redis-cluster:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      - db-content-cluster
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer:/etc/pgbouncer
    command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    environment:
      - TZ=America/New_York

volumes:
  dabblebase-monorepo-node_modules:
  dabblebase-web-node_modules:
  dabblebase-admin-db:
  dabblebase-content-db:
  redis-data: